; ============================================================================
;  Axolotl Buddy — PlatformIO config
;  Target: M5StickS3 (K150)  / ESP32-S3-PICO-1-N8R8
;          8 MB Flash + 8 MB OPI PSRAM, ST7789P3 135x240, BMI270, ES8311
; ============================================================================

[env:m5sticks3]
platform        = espressif32 @ ^6.12.0
board           = esp32-s3-devkitc-1
framework       = arduino

; ---- Flash / PSRAM (N8R8 = octal PSRAM, octal flash) ----
board_build.arduino.memory_type = qio_opi
board_build.flash_size          = 8MB
board_upload.flash_size         = 8MB
board_upload.maximum_size       = 8388608
board_build.f_flash             = 80000000L

; ---- Native USB-Serial-JTAG (VID 303A / PID 8120) ----
;   First flash: M5 stock firmware can hold USB-CDC, blocking auto-reset.
;   Power-cycle the device via PWR button before first upload.
upload_speed    = 460800
upload_port     = COM9
monitor_port    = COM7
monitor_speed   = 115200
monitor_filters = colorize, esp32_exception_decoder
upload_flags    = --before=usb_reset
                  --after=hard_reset

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified @ ^0.2.5
